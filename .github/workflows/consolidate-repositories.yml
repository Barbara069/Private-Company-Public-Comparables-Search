name: Consolidate research repositories
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/consolidate-repositories.yml'
permissions:
  contents: write
concurrency:
  group: consolidate-research-repositories
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical research repository
        uses: actions/checkout@v4
      - name: Check out pinned website snapshot
        uses: actions/checkout@v4
        with:
          repository: Barbara069/private-company-comparables-research
          ref: d6331b95f491e9e1244173001438543b2c609d86
          path: migration-source
          persist-credentials: false
      - name: Consolidate website, methodology and code
        env:
          SOURCE_COMMIT: d6331b95f491e9e1244173001438543b2c609d86
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          source=Path('migration-source'); destination=Path('website')
          destination.mkdir(exist_ok=True); Path('code').mkdir(exist_ok=True)
          incoming=[p for p in source.rglob('*') if p.is_file() and '.git' not in p.relative_to(source).parts]
          checked=0
          for p in incoming:
              rel=p.relative_to(source)
              if rel.parts[0]=='data':
                  target=destination/rel
                  target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,target)
                  assert hashlib.sha256(p.read_bytes()).digest()==hashlib.sha256(target.read_bytes()).digest()
                  checked+=1
          aliases={'site_app.js':'website_app.js','build_site.py':'build_unified_research_site.py','similarity_protocol_legacy.py':'similarity_protocol.py'}
          for p in (source/'src').iterdir():
              if p.is_file() and p.name!='README.md':
                  shutil.copy2(p,Path('code')/aliases.get(p.name,p.name))
          for p in source.glob('0[1-4]_*.md'):
              shutil.copy2(p,Path('code')/p.name)
          # Download links resolve to the single canonical methodology copy.
          for target in [destination/'index.html',Path('code/website_app.js'),Path('code/industry_standard_app.js')]:
              text=(source/'index.html').read_text() if target.name=='index.html' else target.read_text()
              for name in ['01_General_Facets.md','02_Industry_Facets.md','03_Similarity_Scoring.md','04_Revenue_Growth_Methodology.md']:
                  text=text.replace(name,'../code/'+name)
              target.write_text(text)
          (destination/'.nojekyll').write_text('')
          Path('.nojekyll').write_text('')
          Path('index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><title>Private Company Comparables Research</title><script>location.replace("website/"+location.search+location.hash)</script><p><a href="website/">Open the company research website</a></p></html>')
          # Remove redundant root methodology copies if an earlier layout left any.
          for p in Path('.').glob('0[1-4]_*.md'):
              p.unlink()
          (Path('code')/'Repository_Consolidation.json').write_text(json.dumps({'source_repository':'Barbara069/private-company-comparables-research','source_commit':os.environ['SOURCE_COMMIT'],'destination_repository':'Barbara069/Private-Company-Public-Comparables-Search','data_files_hash_verified':checked,'website_directory':'website','canonical_code_directory':'code'},indent=2))
          print('Verified and migrated',checked,'website data files')
          shutil.rmtree(source)
          PY
      - name: Commit consolidated contents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website code index.html .nojekyll
          git add -u
          git diff --cached --quiet || git commit -m "Consolidate website data and canonical research code into one repository"
          git push
