name: Publish indexed forecast prototype delivery
on:
  push:
    paths:
      - '.github/workflows/publish-forecast-prototype.yml'
permissions:
  contents: write
  pages: write
jobs:
  delivery:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      DELIVERY_TAG: v2026.11.16-forecast-prototype
    steps:
      - uses: actions/checkout@v4
      - name: Validate permitted-source publication
        run: |
          python code/exclude_restricted_sources.py --validate
          python code/check_publication_tree.py
          python code/forecast_private.py --input website/data/private_forecast_prototype.json.gz --output /tmp/forecast_verified.json
          node --check code/website_app.js
      - name: Build comprehensive CSV and read it back
        run: python code/publish_clean_release.py prepare
      - name: Commit delivery audit
        run: |
          git config user.name 'Barbara069'
          git config user.email 'Barbara069@users.noreply.github.com'
          git add code/Source_Policy_Audit.json
          git diff --cached --quiet || git commit -m 'Record indexed forecast source and delivery audit'
          git push origin HEAD:main
          echo "CLEAN_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish verified CSV and permitted originals
        run: python code/publish_clean_release.py publish
      - name: Build Pages
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
